[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "privacyanalyzer"
version = "1.0.0"
description = "Explainable Application Privacy and Permission Analyzer"
readme = "README.md"
requires-python = ">=3.10"

# =============================================================================
# VERCEL DEPLOYMENT CONFIGURATION
# Defines the authoritative ASGI application entrypoint for Vercel Serverless
# =============================================================================
[tool.vercel]
entrypoint = "backend.main:app"

# =============================================================================
# VERCEL FASTAPI STATIC FILE OPTIMIZATION
# Explicitly opt-out of CDN static asset collection since this is a pure REST API.
# Prevents: "Warning: FastAPI static file collection failed. Static files will not be served from the CDN."
# =============================================================================
[tool.vercel.fastapi.static]
cdn = false

# =============================================================================
# SETUPTOOLS PACKAGE DISCOVERY CONFIGURATION
# Explicitly discover and package only application modules required by backend,
# preventing setuptools flat-layout auto-discovery errors with frontend/tests/data.
# =============================================================================
[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "knowledge_base*"]
exclude = ["tests*", "frontend*", "alembic*", "data*", "reports*", "uploads*", "venv*"]
namespaces = true

[tool.setuptools.package-data]
knowledge_base = ["*.json"]
